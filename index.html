<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连连看</title>
  <meta name="theme-color" content="#0b6bcb">
  <meta name="description" content="连连看 PWA 小游戏。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #152033;
      --muted: #596579;
      --accent: #0b6bcb;
      --accent-dark: #084f98;
      --good: #157347;
      --border: #d9e2ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #d9ebff 0, transparent 38%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      width: min(680px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: color-mix(in srgb, var(--card) 92%, #eef5ff 8%);
      box-shadow: 0 18px 40px rgba(29, 53, 87, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .version {
      margin-top: 0;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent-dark);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0 4px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 22px rgba(11, 107, 203, 0.18);
    }

    .primary-button:hover,
    .primary-button:focus-visible {
      background: var(--accent-dark);
    }

    .ghost-button {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    .update-banner {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(640px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(10, 24, 45, 0.18);
      z-index: 20;
    }

    .update-banner[hidden] {
      display: none;
    }

    .update-banner strong {
      display: block;
      margin-bottom: 2px;
    }

    .update-banner p {
      margin: 0;
      font-size: 0.92rem;
    }

    .update-actions {
      display: flex;
      flex-shrink: 0;
      gap: 8px;
    }

    a {
      color: var(--accent);
    }

    .game-modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(12, 22, 36, 0.54);
      z-index: 10;
    }

    .game-modal.is-open {
      display: grid;
    }

    .game-panel {
      width: min(520px, 100%);
      max-height: min(92vh, 720px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(10, 24, 45, 0.2);
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 16px;
    }

    .game-header h2 {
      margin: 0 0 6px;
      font-size: 1.45rem;
    }

    .game-header p {
      margin: 0;
      font-size: 0.95rem;
    }

    .game-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 16px;
    }

    .tile {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid #c9d8ea;
      border-radius: 12px;
      background: #eef5ff;
      color: var(--accent-dark);
      font-size: clamp(1.25rem, 8vw, 2rem);
      box-shadow: inset 0 -4px 0 rgba(11, 107, 203, 0.08);
    }

    .tile.is-open {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 10px 18px rgba(11, 107, 203, 0.12);
    }

    .tile.is-matched {
      background: #e8f7ef;
      border-color: #9bd5b8;
      color: var(--good);
      cursor: default;
      box-shadow: none;
    }

    .game-message {
      min-height: 28px;
      margin: 0 0 14px;
      font-weight: 700;
      color: var(--good);
    }

    .sudoku-panel {
      width: min(560px, 100%);
    }

    .difficulty-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .difficulty-row button {
      min-height: 40px;
      padding: 0 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 0.95rem;
    }

    .difficulty-row button.is-active {
      border-color: var(--accent);
      background: #e7f1ff;
      color: var(--accent-dark);
    }

    .sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      width: min(100%, 432px);
      margin: 0 auto 14px;
      border: 2px solid var(--text);
      background: var(--text);
      gap: 1px;
    }

    .sudoku-cell {
      width: 100%;
      aspect-ratio: 1;
      min-width: 0;
      border: 0;
      border-radius: 0;
      padding: 0;
      text-align: center;
      font: 700 clamp(1rem, 5vw, 1.35rem) / 1 system-ui, sans-serif;
      color: var(--accent-dark);
      background: #fff;
      box-shadow: none;
      outline: none;
    }

    .sudoku-cell:nth-child(3n) {
      border-right: 2px solid var(--text);
    }

    .sudoku-cell:nth-child(9n) {
      border-right: 0;
    }

    .sudoku-cell:nth-child(n + 19):nth-child(-n + 27),
    .sudoku-cell:nth-child(n + 46):nth-child(-n + 54) {
      border-bottom: 2px solid var(--text);
    }

    .sudoku-cell.is-given {
      color: var(--text);
      background: #eef5ff;
    }

    .sudoku-cell.is-wrong {
      color: #b42318;
      background: #fff1f0;
    }

    @media (max-width: 480px) {
      main {
        padding: 24px;
      }

      .game-panel {
        padding: 18px;
      }

      .game-header {
        flex-direction: column;
      }

      .update-banner {
        align-items: stretch;
        flex-direction: column;
      }

      .update-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>连连看</h1>
    <p class="version">版本：v5</p>
    <p>选择一个小游戏开始。</p>
    <div class="actions">
      <button class="primary-button" id="openGame" type="button">连连看</button>
      <button class="ghost-button" id="openSudoku" type="button">数独</button>
    </div>
  </main>

  <div class="update-banner" id="updateBanner" hidden>
    <div>
      <strong id="updateTitle">发现新版本</strong>
      <p id="updateText">点击更新安装，完成后会自动刷新。</p>
    </div>
    <div class="update-actions">
      <button class="primary-button" id="updateAction" type="button">更新安装</button>
      <button class="ghost-button" id="updateDismiss" type="button">稍后</button>
    </div>
  </div>

  <section class="game-modal" id="gameModal" aria-hidden="true" aria-labelledby="gameTitle" role="dialog">
    <div class="game-panel">
      <div class="game-header">
        <div>
          <h2 id="gameTitle">连连看</h2>
          <p>翻开两张相同卡片即可消除，全部配对就通关。</p>
        </div>
        <button class="ghost-button" id="closeGame" type="button">关闭</button>
      </div>

      <div class="game-stats">
        <span id="moves">步数：0</span>
        <span id="pairs">配对：0 / 8</span>
      </div>

      <div class="game-board" id="gameBoard" aria-label="连连看棋盘"></div>
      <p class="game-message" id="gameMessage"></p>

      <div class="actions">
        <button class="primary-button" id="restartGame" type="button">重新开始</button>
      </div>
    </div>
  </section>

  <section class="game-modal" id="sudokuModal" aria-hidden="true" aria-labelledby="sudokuTitle" role="dialog">
    <div class="game-panel sudoku-panel">
      <div class="game-header">
        <div>
          <h2 id="sudokuTitle">数独</h2>
          <p>选择难度，填入 1 到 9，让每行、每列、每宫都不重复。</p>
        </div>
        <button class="ghost-button" id="closeSudoku" type="button">关闭</button>
      </div>

      <div class="difficulty-row" aria-label="数独难度">
        <button class="is-active" data-sudoku-level="easy" type="button">易</button>
        <button data-sudoku-level="medium" type="button">中</button>
        <button data-sudoku-level="hard" type="button">难</button>
        <button data-sudoku-level="expert" type="button">超难</button>
      </div>

      <div class="sudoku-board" id="sudokuBoard" aria-label="数独棋盘"></div>
      <p class="game-message" id="sudokuMessage"></p>

      <div class="actions">
        <button class="primary-button" id="checkSudoku" type="button">检查</button>
        <button class="ghost-button" id="restartSudoku" type="button">重新开始</button>
      </div>
    </div>
  </section>

  <script>
    const openGame = document.querySelector("#openGame");
    const openSudoku = document.querySelector("#openSudoku");
    const closeGame = document.querySelector("#closeGame");
    const restartGame = document.querySelector("#restartGame");
    const gameModal = document.querySelector("#gameModal");
    const gameBoard = document.querySelector("#gameBoard");
    const movesLabel = document.querySelector("#moves");
    const pairsLabel = document.querySelector("#pairs");
    const gameMessage = document.querySelector("#gameMessage");
    const updateBanner = document.querySelector("#updateBanner");
    const updateTitle = document.querySelector("#updateTitle");
    const updateText = document.querySelector("#updateText");
    const updateAction = document.querySelector("#updateAction");
    const updateDismiss = document.querySelector("#updateDismiss");
    const sudokuModal = document.querySelector("#sudokuModal");
    const closeSudoku = document.querySelector("#closeSudoku");
    const sudokuBoard = document.querySelector("#sudokuBoard");
    const sudokuMessage = document.querySelector("#sudokuMessage");
    const checkSudoku = document.querySelector("#checkSudoku");
    const restartSudoku = document.querySelector("#restartSudoku");
    const sudokuLevelButtons = document.querySelectorAll("[data-sudoku-level]");
    const tiles = ["医", "码", "云", "测", "端", "页", "库", "AI"];
    let audioContext = null;
    let waitingWorker = null;
    let deferredInstallPrompt = null;
    let refreshingForUpdate = false;

    let firstTile = null;
    let lockBoard = false;
    let moves = 0;
    let matchedPairs = 0;
    let currentSudokuLevel = "easy";
    const sudokuSolution = "534678912672195348198342567859761423426853791713924856961537284287419635345286179";
    const sudokuPuzzles = {
      easy: "530070000600195000098000060800060003400803001700020006060000280000419005000080079",
      medium: "000678900670000348100340000859000400006803700003000856000537004287000630005286000",
      hard: "000000900070195000100000500000061003400000001700920000000000280000410005305000000",
      expert: "000000000070000300000300007050000020400800001000000050900000000000010005000200070"
    };

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function updateStats() {
      movesLabel.textContent = `步数：${moves}`;
      pairsLabel.textContent = `配对：${matchedPairs} / ${tiles.length}`;
    }

    function getAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        return null;
      }

      if (!audioContext) {
        audioContext = new AudioContext();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      return audioContext;
    }

    function playTone(frequency, duration = 0.12, type = "sine", volume = 0.12, delay = 0) {
      const context = getAudioContext();
      if (!context) {
        return;
      }

      const startTime = context.currentTime + delay;
      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, startTime);
      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.02);
    }

    function playSound(name) {
      if (name === "flip") {
        playTone(520, 0.08, "triangle", 0.08);
        return;
      }

      if (name === "match") {
        playTone(660, 0.09, "sine", 0.11);
        playTone(880, 0.12, "sine", 0.1, 0.08);
        return;
      }

      if (name === "miss") {
        playTone(240, 0.14, "sawtooth", 0.07);
        return;
      }

      if (name === "win") {
        playTone(660, 0.1, "sine", 0.1);
        playTone(880, 0.12, "sine", 0.1, 0.1);
        playTone(1100, 0.18, "sine", 0.1, 0.22);
      }
    }

    function buildBoard() {
      firstTile = null;
      lockBoard = false;
      moves = 0;
      matchedPairs = 0;
      gameMessage.textContent = "";
      gameBoard.innerHTML = "";
      updateStats();

      shuffle([...tiles, ...tiles]).forEach((value, index) => {
        const button = document.createElement("button");
        button.className = "tile";
        button.type = "button";
        button.dataset.value = value;
        button.dataset.index = index;
        button.textContent = "？";
        button.setAttribute("aria-label", "未翻开的卡片");
        button.addEventListener("click", () => flipTile(button));
        gameBoard.appendChild(button);
      });
    }

    function flipTile(tile) {
      if (lockBoard || tile === firstTile || tile.classList.contains("is-matched")) {
        return;
      }

      tile.classList.add("is-open");
      tile.textContent = tile.dataset.value;
      tile.setAttribute("aria-label", `卡片 ${tile.dataset.value}`);
      playSound("flip");

      if (!firstTile) {
        firstTile = tile;
        return;
      }

      moves += 1;
      updateStats();

      if (firstTile.dataset.value === tile.dataset.value) {
        firstTile.classList.add("is-matched");
        tile.classList.add("is-matched");
        playSound("match");
        firstTile = null;
        matchedPairs += 1;
        updateStats();

        if (matchedPairs === tiles.length) {
          playSound("win");
          gameMessage.textContent = `通关成功，用了 ${moves} 步。`;
        }
        return;
      }

      lockBoard = true;
      const previousTile = firstTile;
      window.setTimeout(() => {
        playSound("miss");
        [previousTile, tile].forEach((item) => {
          item.classList.remove("is-open");
          item.textContent = "？";
          item.setAttribute("aria-label", "未翻开的卡片");
        });
        firstTile = null;
        lockBoard = false;
      }, 650);
    }

    function showGame() {
      gameModal.classList.add("is-open");
      gameModal.setAttribute("aria-hidden", "false");
      buildBoard();
    }

    function hideGame() {
      gameModal.classList.remove("is-open");
      gameModal.setAttribute("aria-hidden", "true");
    }

    openGame.addEventListener("click", showGame);
    closeGame.addEventListener("click", hideGame);
    restartGame.addEventListener("click", buildBoard);
    gameModal.addEventListener("click", (event) => {
      if (event.target === gameModal) {
        hideGame();
      }
    });

    function setSudokuLevel(level) {
      currentSudokuLevel = level;
      sudokuLevelButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.sudokuLevel === level);
      });
      buildSudoku();
    }

    function buildSudoku() {
      const puzzle = sudokuPuzzles[currentSudokuLevel];
      sudokuBoard.innerHTML = "";
      sudokuMessage.textContent = "";

      [...puzzle].forEach((value, index) => {
        const input = document.createElement("input");
        input.className = "sudoku-cell";
        input.type = "tel";
        input.inputMode = "numeric";
        input.maxLength = 1;
        input.setAttribute("aria-label", `第 ${Math.floor(index / 9) + 1} 行第 ${(index % 9) + 1} 列`);

        if (value !== "0") {
          input.value = value;
          input.readOnly = true;
          input.classList.add("is-given");
        } else {
          input.addEventListener("input", () => {
            input.value = input.value.replace(/[^1-9]/g, "").slice(0, 1);
            input.classList.remove("is-wrong");
            sudokuMessage.textContent = "";
          });
        }

        sudokuBoard.appendChild(input);
      });
    }

    function checkSudokuBoard() {
      const cells = [...sudokuBoard.querySelectorAll(".sudoku-cell")];
      let hasBlank = false;
      let hasWrong = false;

      cells.forEach((cell, index) => {
        const isWrong = cell.value && cell.value !== sudokuSolution[index];
        hasBlank = hasBlank || !cell.value;
        hasWrong = hasWrong || isWrong;
        cell.classList.toggle("is-wrong", isWrong);
      });

      if (hasWrong) {
        sudokuMessage.textContent = "有数字不对，红色格子需要修改。";
        return;
      }

      if (hasBlank) {
        sudokuMessage.textContent = "还有空格，继续完成。";
        return;
      }

      sudokuMessage.textContent = "通关成功！";
      playSound("win");
    }

    function showSudoku() {
      sudokuModal.classList.add("is-open");
      sudokuModal.setAttribute("aria-hidden", "false");
      buildSudoku();
    }

    function hideSudoku() {
      sudokuModal.classList.remove("is-open");
      sudokuModal.setAttribute("aria-hidden", "true");
    }

    openSudoku.addEventListener("click", showSudoku);
    closeSudoku.addEventListener("click", hideSudoku);
    restartSudoku.addEventListener("click", buildSudoku);
    checkSudoku.addEventListener("click", checkSudokuBoard);
    sudokuLevelButtons.forEach((button) => {
      button.addEventListener("click", () => setSudokuLevel(button.dataset.sudokuLevel));
    });
    sudokuModal.addEventListener("click", (event) => {
      if (event.target === sudokuModal) {
        hideSudoku();
      }
    });

    function showUpdatePrompt(worker) {
      waitingWorker = worker;
      updateTitle.textContent = "发现新版本";
      updateText.textContent = "点击更新安装，完成后会自动刷新。";
      updateAction.textContent = "更新安装";
      updateBanner.hidden = false;
    }

    function showInstallPrompt() {
      updateTitle.textContent = "可以安装应用";
      updateText.textContent = "安装后可从桌面直接打开连连看。";
      updateAction.textContent = "安装";
      updateBanner.hidden = false;
    }

    updateAction.addEventListener("click", async () => {
      if (waitingWorker) {
        waitingWorker.postMessage({ type: "SKIP_WAITING" });
        return;
      }

      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        updateBanner.hidden = true;
      }
    });

    updateDismiss.addEventListener("click", () => {
      updateBanner.hidden = true;
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      if (!waitingWorker) {
        showInstallPrompt();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").then((registration) => {
          if (registration.waiting && navigator.serviceWorker.controller) {
            showUpdatePrompt(registration.waiting);
          }

          registration.addEventListener("updatefound", () => {
            const worker = registration.installing;
            if (!worker) {
              return;
            }

            worker.addEventListener("statechange", () => {
              if (worker.state === "installed" && navigator.serviceWorker.controller) {
                showUpdatePrompt(worker);
              }
            });
          });

          registration.update();
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshingForUpdate) {
          return;
        }

        refreshingForUpdate = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
