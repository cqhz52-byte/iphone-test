<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iphone-test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #152033;
      --muted: #596579;
      --accent: #0b6bcb;
      --border: #d9e2ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #d9ebff 0, transparent 38%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    main {
      width: min(680px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: color-mix(in srgb, var(--card) 92%, #eef5ff 8%);
      box-shadow: 0 18px 40px rgba(29, 53, 87, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 14px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--muted);
    }

    .pill {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e7f1ff;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.92rem;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <div class="pill">GitHub Pages Ready</div>
    <h1>iphone-test</h1>
    <p>This is a minimal static site for the mobile Codex end-to-end deployment exercise.</p>
    <p>If you can read this page on GitHub Pages, the repository root deployment is working.</p>
    <p>Repository: <a href="https://github.com/cqhz52-byte/iphone-test">cqhz52-byte/iphone-test</a></p>
  </main>
</body>
</html>
